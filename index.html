<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><title>Anatomy Trainer</title><link rel="stylesheet" href="style.css"></head><body><main class="app">
<header><div><div class="eyebrow">ANATOMY TRAINER</div><h1 id="pageTitle">Choose an area</h1></div><button id="changeArea" class="textBtn hidden">Change area</button></header>
<section id="areaScreen"><p class="intro">Choose the muscles for this learning session.</p><div id="areas" class="areaGrid"></div></section>
<section id="studyScreen" class="hidden"><div class="sessionBar"><span id="areaName"></span><span id="counter"></span></div>
<article class="studyCard"><div class="imagePanel"><img id="muscleImage" alt=""><div id="imageFallback" class="fallback hidden">Image not available</div></div>
<div class="factsPanel">
<div class="fact" data-key="name"><div class="factHead"><span>Name</span><button class="reveal">Reveal</button></div><div class="answer"></div></div>
<div class="fact locked" data-key="origin"><div class="factHead"><span>Origin</span><button class="reveal">Reveal</button></div><div class="answer"></div></div>
<div class="fact locked" data-key="insertion"><div class="factHead"><span>Insertion</span><button class="reveal">Reveal</button></div><div class="answer"></div></div>
<div class="fact locked" data-key="action"><div class="factHead"><span>Action</span><button class="reveal">Reveal</button></div><div class="answer"></div></div>
</div></article><div class="nav"><button id="previous" class="secondary">Previous</button><button id="next" class="primary">Next muscle</button></div></section>
</main><script src="app.js"></script></body></html>
