<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Anatomy Trainer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <div class="languageSwitch" role="group" aria-label="Language">
    <button type="button" id="langDA" class="lang">Dansk / Latin</button>
    <button type="button" id="langEN" class="lang">English</button>
  </div>

  <header>
    <div><div class="eyebrow">ANATOMY TRAINER</div><h1 id="pageTitle"></h1></div>
    <button type="button" id="changeArea" class="textBtn hidden"></button>
  </header>

  <section id="areaScreen">
    <p id="intro" class="intro"></p>
    <div id="areas" class="areaGrid"></div>
  </section>

  <section id="studyScreen" class="hidden">
    <div class="sessionBar"><span id="areaName"></span><span id="counter"></span></div>
    <article class="studyCard">
      <div class="imagePanel">
        <img id="muscleImage" alt="">
        <div id="imageFallback" class="fallback hidden"></div>
      </div>
      <div class="factsPanel">
        <div class="fact" data-key="name"><div class="factHead"><span></span></div><div class="answer"></div></div>
        <div class="fact locked" data-key="origin"><div class="factHead"><span></span></div><div class="answer"></div></div>
        <div class="fact locked" data-key="insertion"><div class="factHead"><span></span></div><div class="answer"></div></div>
        <div class="fact locked" data-key="action"><div class="factHead"><span></span></div><div class="answer"></div></div>
      </div>
    </article>
    <div class="nav">
      <button type="button" id="previous" class="secondary"></button>
      <button type="button" id="revealNext" class="primary bigReveal"></button>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body></html>
