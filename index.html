<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anatomy Trainer</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app">
<header><div><small>ANATOMY TRAINER</small><h1 id="title">Shoulder & Upper Arm</h1></div><button id="resetStats" class="icon">↻</button></header>
<section id="home">
<div class="hero"><div class="bodyIcon">◉</div><h2>Learn it. Locate it. Connect it.</h2><p>20 muscles • origins • insertions • actions • nerves</p></div>
<div class="stats"><div><b id="studied">0</b><span>Studied</span></div><div><b id="known">0</b><span>Known</span></div><div><b id="accuracy">—</b><span>Accuracy</span></div></div>
<div class="modegrid"><button data-mode="study"><b>Study</b><span>Explore the cards</span></button><button data-mode="name"><b>Name the muscle</b><span>Identify highlighted muscle</span></button><button data-mode="origin"><b>Origin</b><span>Recall proximal attachment</span></button><button data-mode="insertion"><b>Insertion</b><span>Recall distal attachment</span></button><button data-mode="action"><b>Action</b><span>Recall movement/function</span></button><button data-mode="mixed"><b>Mixed quiz</b><span>Everything together</span></button></div>
</section>
<section id="cardScreen" class="hidden">
<div class="toprow"><button id="back">‹ Home</button><span id="progress"></span></div>
<div class="card">
<div id="prompt" class="prompt"></div>
<div class="anatomyWrap"><img id="anatomyImage" class="anatomyImage" alt="Anatomy study image"><div class="view" id="view"></div><div id="imageFallback" class="imageFallback hidden">Image unavailable — replace this card image later.</div></div>
<div id="answer" class="answer hidden"></div>
<button id="reveal" class="primary">Show answer</button>
<div id="ratings" class="ratings hidden"><button data-rating="again">Again</button><button data-rating="hard">Hard</button><button data-rating="known">Got it</button></div>
</div></section>
<footer>V0.2 • Anatomical image edition</footer>
</main><script src="app.js"></script></body></html>
